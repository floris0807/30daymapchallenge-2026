<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>30DayMapChallenge 2026</title>
<meta name="description" content="海と気象を題材にした #30DayMapChallenge 2026 の地図。">
<style>
  :root { color-scheme: dark; }
  body { margin: 0; background: #070d18; color: #e6edf7; font-family: -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif; line-height: 1.7; }
  main { max-width: 720px; margin: 0 auto; padding: 48px 16px; }
  h1 { font-size: clamp(20px, 6vw, 28px); margin: 0 0 4px; overflow-wrap: anywhere; }
  p.lead { color: #9fb0c8; margin: 0 0 32px; }
  ul { list-style: none; padding: 0; margin: 0; display: grid; gap: 16px; }
  a.card { display: block; border: 1px solid #1d2a40; border-radius: 12px; overflow: hidden; color: inherit; text-decoration: none; background: #0b1424; }
  a.card:hover, a.card:focus-visible { border-color: #5aa2ff; }
  a.card img { display: block; width: 100%; height: auto; }
  a.card div { padding: 12px 16px; }
  .day { color: #f0a63a; font-family: ui-monospace, Menlo, monospace; font-size: 13px; }
  .name { font-weight: 600; }
  footer { margin-top: 40px; color: #7f90a8; font-size: 13px; }
  footer a { color: inherit; }
</style>
</head>
<body>
<main>
  <h1>30DayMapChallenge 2026</h1>
  <p class="lead">海と気象を題材に、毎日1枚。</p>
  <ul>
    <li>
      <a class="card" href="day13-interactions/">
        <img src="day13-interactions/day13.png" alt="日本近海の風と波を重ねた地図" width="1600" height="900">
        <div><span class="day">Day 13 · Interactions</span><br><span class="name">風と波 — 日本近海</span></div>
      </a>
    </li>
  </ul>
  <footer>
    Weather data by <a href="https://open-meteo.com/">Open-Meteo.com</a> (CC BY 4.0) ·
    Basemap © OpenFreeMap © OpenMapTiles © OpenStreetMap contributors ·
    <a href="https://github.com/floris0807/30daymapchallenge-2026">GitHub</a>
  </footer>
</main>
</body>
</html>
