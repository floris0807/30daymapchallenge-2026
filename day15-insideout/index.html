<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>足の下の星座 — Planisphaerium Subterraneum</title>
<meta name="description" content="#30DayMapChallenge Day 15: Inside out. 日本の地下から見上げた20年分の震源を古い星図として描く。深い地震ほど西にあり、切ると沈む板が現れる。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&family=IM+Fell+English+SC&family=Shippori+Mincho+B1:wght@500;700;800&display=block" rel="stylesheet">
<style>
  html, body { margin: 0; background: #EDE3CC; }
  body.wide { height: 100vh; overflow: hidden; }
  canvas { display: block; }
  body.wide canvas { position: fixed; inset: 0; }
  #stop { position: absolute; font-family: "Shippori Mincho B1", serif; font-weight: 500; font-size: 12px; color: #7A6A55;
    background: none; border: none; padding: 2px 4px; cursor: pointer; letter-spacing: .08em; z-index: 2; }
  #stop:hover, #stop:focus-visible { color: #2A2119; text-decoration: underline; outline: none; }
  .shot #stop { display: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<button id="stop" type="button" aria-pressed="false">動きを止める</button>
<script src="https://cdn.jsdelivr.net/npm/d3@7.9.0/dist/d3.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/topojson-client@3.1.0/dist/topojson-client.min.js"></script>
<script>
'use strict';
// capture.mjs は MapLibre の map.areTilesLoaded() を待つ。地図ライブラリを使わないので常に true の代役を置く
window.map = { areTilesLoaded: () => true };
const SHOT = new URLSearchParams(location.search).has('shot');
if (SHOT) document.documentElement.classList.add('shot');

// ---- 決まりごと ----------------------------------------------------------
const L = 30; window.LOOP = L;                 // 1 周の秒数
const RE = 6371;                               // 地球の平均半径 km
const CAM = { lon: 138.5, lat: 35.5, depth: 1800, orbit: 55 };   // 視点の軌道（中心・半径 km）。半径は視差の振れ幅の条件から決めた
const TARGET = [138.5, 36.5];                  // 見上げる地表の点
const CEIL_CLIP = 28;                          // 天井を描く範囲（見上げる点からの角距離、度）。これより外は視点の背後に近い
const SEC_KM = 2100, SEC_DEPTH = 700, SEC_LON0 = 138.5;   // 断面：横 2,100 km（中心 138.5°E）× 深さ 700 km、縦横同じ縮尺
const HALF = 2;                                // 帯の半幅（度）
const STOPS = [                                 // 帯の停止。φ は中央緯度
  { name: '北海道・千島', phi: 44, t0: -1, t1: 3 },
  { name: '東北', phi: 39, t0: 6, t1: 14 },
  { name: '伊豆・小笠原', phi: 29, t0: 22, t1: 28 },
];
const C = { paper: '#EDE3CC', ink: '#2A2119', sumi: '#7A6A55', ai: '#15213F', aiLand: '#1D2B50', line: '#D9C9A3',
  shallow: '#A39A82', mid: '#E2BE5E', deep: '#CDEAF6', shuAi: '#E8694A', shuPaper: '#A63A28' };
const JP = '"Shippori Mincho B1", serif', FELL = '"IM Fell English", serif', FELLSC = '"IM Fell English SC", serif';
const DESC = '日本の地下 約1,800 km から見上げた、20 年分の震源（M4.5 以上、14,243 件）。深い星ほど西にあり、切ると沈む板が現れる。';
const NOTE = '限界：深さには震源決定の誤差がある。深さが決まらず 10 km ちょうど（全体の 22%）、35 km ちょうど（1,243 件）の固定値にされた記録を含み、浅い側の深さの細部は読めない。M4.5 未満は含まない。傾きは深さ 70 km 超の点への直線の当てはめで、東西に切った見かけの値。';
const ICHI_H = '一　見上げる', ICHI_T = '── 足の下 約1,800 km から。夜空の星図と同じく、見上げる地図は東が左';
const PLACES = [['東京', 139.69, 35.69], ['札幌', 141.35, 43.06], ['福岡', 130.40, 33.59], ['ソウル', 126.98, 37.57]];
const SEAS = [['太平洋', 146, 31], ['日本海', 135, 40.5]];

const rad = Math.PI / 180;
const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
const ease = x => 0.5 - 0.5 * Math.cos(Math.PI * clamp(x, 0, 1));
const kmPerDeg = phi => 111.32 * Math.cos(phi * rad);
const depthClass = d => d <= 70 ? 0 : d <= 300 ? 1 : 2;
const magR = m => m < 5 ? 1.1 : m < 6 ? 1.8 : m < 7 ? 2.8 : 4.2;
const STAR_COL = [C.shallow, C.mid, C.deep], STAR_A = [0.35, 0.9, 1];

// ---- 帯の動き（t だけで決まる） -------------------------------------------
function bandAt(t) {
  const u = ((t % L) + L) % L;
  let phi, a = 1;
  if (u < 3) phi = 44;
  else if (u < 6) phi = 44 - 5 * ease((u - 3) / 3);
  else if (u < 14) phi = 39;
  else if (u < 22) phi = 39 - 10 * ease((u - 14) / 8);
  else if (u < 29) { phi = 29; if (u >= 28) a = 1 - (u - 28); }
  else { phi = 44; a = u - 29; }
  // 停止中の数字：入って 0.4 秒でフェードイン、出る 0.4 秒前にフェードアウト（北海道は 29 秒から始まる停止）
  let stop = null, na = 0;
  for (const s of STOPS) {
    const v = (s.t0 < 0 && u >= 29) ? u - L : u;
    if (v >= s.t0 && v <= s.t1) { stop = s; na = clamp((v - s.t0) / 0.4, 0, 1) * clamp((s.t1 - v) / 0.4, 0, 1); }
  }
  return { phi, a, stop, na };
}

// ---- 地心直交座標と視点 ----------------------------------------------------
function ecef(lon, lat, depth = 0) {
  const r = RE - depth, cl = Math.cos(lat * rad);
  return [r * cl * Math.cos(lon * rad), r * cl * Math.sin(lon * rad), r * Math.sin(lat * rad)];
}
const sub = (a, b) => [a[0] - b[0], a[1] - b[1], a[2] - b[2]];
const dot = (a, b) => a[0] * b[0] + a[1] * b[1] + a[2] * b[2];
const cross = (a, b) => [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]];
const norm = a => { const l = Math.hypot(...a); return [a[0] / l, a[1] / l, a[2] / l]; };
const east = lon => [-Math.sin(lon * rad), Math.cos(lon * rad), 0];
const north = (lon, lat) => [-Math.sin(lat * rad) * Math.cos(lon * rad), -Math.sin(lat * rad) * Math.sin(lon * rad), Math.cos(lat * rad)];
let cam, CX = 0, CY = 0, F = 1, ZREF = 1;
// 標準の lookAt（right = 前方 × 北）。地下から北を上にして見上げると right は西を向き、東西は自然に逆になる
function setCamera(t) {
  const th = 2 * Math.PI * (((t % L) + L) % L) / L;
  const c0 = ecef(CAM.lon, CAM.lat, CAM.depth), E = east(CAM.lon), N = north(CAM.lon, CAM.lat);
  const pos = c0.map((v, i) => v + CAM.orbit * (Math.cos(th) * E[i] + Math.sin(th) * N[i]));
  const tp = ecef(...TARGET), f = norm(sub(tp, pos)), right = norm(cross(f, north(...TARGET)));
  cam = { pos, f, right, up: cross(right, f) };
  ZREF = dot(sub(tp, pos), f);
}
function project(p) {
  const v = sub(p, cam.pos), z = dot(v, cam.f);
  if (z < 50) return null;
  return [CX + F * dot(v, cam.right) / z, CY - F * dot(v, cam.up) / z, z];
}
// 天井（深さ 0）を d3 の投影として包む：見上げる点を中心に 28° で球面のまま切ってから透視に通す
const unrot = d3.geoRotation([-TARGET[0], -TARGET[1]]);
// d3 は作るときに raw(0,0) で中心を測って平行移動に焼き込む。見上げる点は常に画面中心に来るので、
// 中心からの相対で返し、平行移動は translate([CX, CY]) に任せる
function ceilRaw(l, p) {
  if (!cam) return [0, 0];
  const [lon, lat] = unrot.invert([l / rad, p / rad]);
  const s = project(ecef(lon, lat)) || [CX, CY];
  return [s[0] - CX, CY - s[1]];
}
const ceil = d3.geoProjection(ceilRaw).rotate([-TARGET[0], -TARGET[1]]).clipAngle(CEIL_CLIP)
  .scale(1).translate([0, 0]).precision(0.4);

// ---- データと集計 -----------------------------------------------------------
let Q, land, coast, stats, deepest;
// 断面の窓（中心 138.5°E から東西 1,050 km）に入るか
const inWindow = (lon, phi) => Math.abs((lon - SEC_LON0) * kmPerDeg(phi)) <= SEC_KM / 2;
function fitBand(q, phi) {
  const k = kmPerDeg(phi);
  const s = q.filter(r => Math.abs(r[1] - phi) <= HALF && r[2] > 70 && inWindow(r[0], phi));
  if (s.length < 3) return { n: s.length };
  const xs = s.map(r => (r[0] - SEC_LON0) * k), ys = s.map(r => r[2]);
  const mx = d3.mean(xs), my = d3.mean(ys);
  const sxy = d3.sum(xs, (x, i) => (x - mx) * (ys[i] - my)), sxx = d3.sum(xs, x => (x - mx) ** 2), syy = d3.sum(ys, y => (y - my) ** 2);
  const slope = sxy / sxx, r = sxy / Math.sqrt(sxx * syy);
  return { n: s.length, slope, icpt: my - slope * mx, r, dip: Math.atan(-slope) / rad, maxDepth: d3.max(ys),
    show: Math.abs(r) >= 0.9 && s.length >= 30 };
}
function computeStats(q) {
  const band = [0, 0, 0], west = [0, 0, 0];
  for (const r of q) { const c = depthClass(r[2]); band[c]++; if (r[0] < 140) west[c]++; }
  const d = q.reduce((a, b) => b[2] > a[2] ? b : a);
  return { n: q.length, band, westShare: west.map((w, i) => w / band[i]),
    deepest: { lon: d[0], lat: d[1], depth: d[2], mag: d[3], year: Math.floor(d[4]), id: d[5] },
    fixed10: q.filter(r => r[2] === 10).length, fixed35: q.filter(r => r[2] === 35).length,
    stops: STOPS.map(s => ({ name: s.name, lo: s.phi - HALF, hi: s.phi + HALF, ...fitBand(q, s.phi) })) };
}

// ---- レイアウト -------------------------------------------------------------
const canvas = document.getElementById('c'), ctx = canvas.getContext('2d');
let W, H, dpr, wide, lay;
function wrapLines(text, font, maxW) {
  // 英数字の連なり（−0.98 など）は割らない。句読点・閉じ括弧は行頭に置かない（前の行へぶら下げる）
  ctx.font = font; const out = []; let cur = '';
  for (const tk of text.match(/[A-Za-z0-9.,%−+°|〜-]+|./gu)) {
    if (ctx.measureText(cur + tk).width > maxW && cur && !/^[、。）」，．]/.test(tk)) { out.push(cur); cur = tk.trimStart(); }
    else cur += tk;
  }
  if (cur) out.push(cur); return out;
}
function resize() {
  dpr = Math.min(devicePixelRatio || 1, 2);
  W = innerWidth; const vh = innerHeight;
  wide = W / vh >= 1.45 && W >= 1100;
  document.body.classList.toggle('wide', wide);
  if (wide) {
    H = vh; const u = Math.min(W / 1600, H / 900);
    lay = { wide: true, u, ox: (W - 1600 * u) / 2, oy: (H - 900 * u) / 2, w: 1600, h: 900,
      circle: { x: 480, y: 438, R: 360 }, ichi: { y: 868 },
      head: { x: 940, y: 60, w: 620 }, ni: { x: 940, y: 250, w: 620 },
      san: { x: 940, y: 436, w: 620 }, legend: { x: 940, y: 748 }, note: { x: 940, y: 778, w: 620 },
      src: { x: 940, y: 858, w: 620 } };
  } else {
    // 1 列（最大 720px）。上から：題・説明 → 円 → 一 → 三 → 二 → 凡例・注記・出典
    const colW = Math.min(720, W - 48), x = (W - colW) / 2, mob = colW < 500;
    let y = 40; const L0 = {};
    const titleSize = mob ? 26 : 40;
    L0.head = { x, y, w: colW, titleSize };
    const descLines = wrapLines(DESC, `500 ${mob ? 14 : 16}px ${JP}`, colW).length;
    y += titleSize + 8 + 18 + 20 + 6 + descLines * (mob ? 23 : 26) + 24;
    const R = colW / 2 - 14 - 46;   // 輪 14px と、左右に回したラテン語の方位ぶん
    L0.circle = { x: W / 2, y: y + R + 14 + 30, R };
    y = L0.circle.y + R + 14 + 34;
    const ichiLines = wrapLines(ICHI_T, `500 13px ${JP}`, colW).length;
    L0.ichi = { y: y + 6, lines: ichiLines }; y += 22 + ichiLines * 20 + 18;
    const secDW = colW - 40, secDH = secDW / 3;
    L0.san = { x, y, w: colW, dw: secDW, dh: secDH }; y += 44 + secDH + 64 + 24;
    L0.ni = { x, y, w: colW, mob }; y += mob ? 270 : 190;
    L0.legend = { x, y }; y += 30;
    const noteLines = wrapLines(NOTE, `500 11.5px ${JP}`, colW).length;
    L0.note = { x, y, w: colW }; y += noteLines * 18 + 14;
    L0.src = { x, y, w: colW }; y += 60;
    H = Math.ceil(y + 30);
    lay = { wide: false, u: 1, ox: 0, oy: 0, w: W, h: H, ...L0 };
  }
  canvas.width = Math.round(W * dpr); canvas.height = Math.round(H * dpr);
  canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
  // 円の大きさに合わせて焦点距離を決める（地表の日本列島が円の 2/3 ほどに入る）
  CX = lay.circle.x; CY = lay.circle.y; F = lay.circle.R * 1.0; ceil.translate([CX, CY]);
  const b = document.getElementById('stop');
  if (wide) { b.style.left = (lay.ox + 1556 * lay.u - 110) + 'px'; b.style.top = (lay.oy + 30 * lay.u) + 'px'; }
  else { b.style.left = (W - 16 - 110) + 'px'; b.style.top = '12px'; }
}

// ---- 描画の部品 -------------------------------------------------------------
function text(s, x, y, font, color, align = 'left', spacing = 0) {
  ctx.font = font; ctx.fillStyle = color; ctx.textAlign = align; ctx.textBaseline = 'alphabetic';
  ctx.letterSpacing = spacing + 'px'; ctx.fillText(s, x, y); ctx.letterSpacing = '0px';
}
function drawFrame() {
  const { w, h } = lay;
  ctx.strokeStyle = C.ink;
  const m = lay.wide ? 20 : 8;
  ctx.lineWidth = 1.5; ctx.strokeRect(m, m, w - 2 * m, h - 2 * m);
  ctx.lineWidth = 0.5; ctx.strokeRect(m + 5.5, m + 5.5, w - 2 * m - 11, h - 2 * m - 11);
}
function starPath(x, y, r) { ctx.beginPath(); ctx.arc(x, y, r, 0, 6.2832); }
function drawStar(x, y, r, cls, alpha) {
  ctx.globalAlpha = STAR_A[cls] * alpha;
  if (cls === 2) {  // 深い星：光芒 → 藍の縁 → 塗り → 白抜きの輪
    ctx.globalAlpha = 0.10 * alpha; ctx.fillStyle = C.deep; starPath(x, y, r * 2.5); ctx.fill();
    ctx.globalAlpha = alpha;
  }
  if (cls > 0) { ctx.strokeStyle = C.ai; ctx.lineWidth = 0.75 * 2; starPath(x, y, r); ctx.stroke(); }
  ctx.fillStyle = STAR_COL[cls]; starPath(x, y, r); ctx.fill();
  if (cls === 2) { ctx.strokeStyle = C.deep; ctx.lineWidth = 0.6; starPath(x, y, r + 1.5); ctx.stroke(); }
}

// 天井の経線・緯線と円の交点（輪の目盛り、引き出し線、三角に使う）
function circleCrossings(line) {
  const { x: cx, y: cy, R } = lay.circle, out = [];
  let prev = null;
  for (const [lo, la] of line) {
    if (d3.geoDistance([lo, la], TARGET) > CEIL_CLIP * rad) { prev = null; continue; }
    const s = project(ecef(lo, la)); if (!s) { prev = null; continue; }
    const d = Math.hypot(s[0] - cx, s[1] - cy);
    if (prev && (prev.d - R) * (d - R) < 0) {
      const k = (R - prev.d) / (d - prev.d);
      out.push([prev.s[0] + k * (s[0] - prev.s[0]), prev.s[1] + k * (s[1] - prev.s[1])]);
    }
    prev = { s, d };
  }
  return out;
}
const parallel = (lat, step = 0.25) => d3.range(100, 180.001, step).map(lo => [lo, lat]);
const meridian = (lon, step = 0.25) => d3.range(0, 70.001, step).map(la => [lon, la]);

function drawCircle(t, band) {
  const { x: cx, y: cy, R } = lay.circle;
  const path = d3.geoPath(ceil, ctx);
  ctx.save();
  ctx.beginPath(); ctx.arc(cx, cy, R, 0, 6.2832); ctx.fillStyle = C.ai; ctx.fill(); ctx.clip();
  // 天井：陸・5° の経緯線・海岸
  ctx.beginPath(); path(land); ctx.fillStyle = C.aiLand; ctx.fill();
  ctx.beginPath(); path(d3.geoGraticule().step([5, 5]).extent([[95, -5], [185, 75]])());
  ctx.globalAlpha = 0.22; ctx.lineWidth = 0.6; ctx.strokeStyle = C.line; ctx.stroke();
  ctx.beginPath(); path(coast); ctx.globalAlpha = 0.75; ctx.lineWidth = 1.1; ctx.stroke(); ctx.globalAlpha = 1;
  // 帯の南北の緯線（朱）
  ctx.globalAlpha = band.a; ctx.strokeStyle = C.shuAi; ctx.lineWidth = 1.2;
  for (const la of [band.phi - HALF, band.phi + HALF]) { ctx.beginPath(); path({ type: 'LineString', coordinates: parallel(la, 1) }); ctx.stroke(); }
  ctx.globalAlpha = 1;
  // 星：浅い順（遠い順）。帯の外は ×0.35（帯が消える間は全体が 0.35 に寄る）
  for (const r of Q) {
    const s = project(r.p); if (!s) continue;
    const dx = s[0] - cx, dy = s[1] - cy; if (dx * dx + dy * dy > (R + 8) ** 2) continue;
    const inBand = Math.abs(r[1] - band.phi) <= HALF;
    const alpha = inBand ? 0.35 + 0.65 * band.a : 0.35;
    let rr = magR(r[3]) * clamp(ZREF / s[2], 0.75, 2.0);
    if (r.cls === 0) rr = Math.min(rr, 1.8);
    drawStar(s[0], s[1], rr, r.cls, alpha);
    if (r === deepest) deepest.scr = [s[0], s[1], rr];
  }
  ctx.globalAlpha = 1;
  // いちばん深い 683 km：朱の輪とラベル
  if (deepest.scr) {
    const [x, y, rr] = deepest.scr;
    ctx.strokeStyle = C.shuAi; ctx.lineWidth = 0.8; starPath(x, y, rr + 4); ctx.stroke();
    halo(`${Math.round(stats.deepest.depth)} km（${stats.deepest.year}）`, x + rr + 8, y + 4, `500 11px ${JP}`, C.line, 'left');
  }
  // 地名（画面座標に普通に書くので鏡文字にならない）
  for (const [n, lo, la] of PLACES) {
    const s = project(ecef(lo, la)); if (!s) continue;
    ctx.fillStyle = C.line; starPath(s[0], s[1], 2); ctx.fill();
    halo(n, s[0], s[1] - 7, `500 13px ${JP}`, C.line, 'center');
  }
  for (const [n, lo, la] of SEAS) {
    const s = project(ecef(lo, la)); if (!s) continue;
    ctx.globalAlpha = 0.6; halo(n, s[0], s[1], `500 15px ${JP}`, C.line, 'center', 6); ctx.globalAlpha = 1;
  }
  ctx.restore();
  drawRing(band);
}
function halo(s, x, y, font, color, align, spacing = 0) {
  ctx.font = font; ctx.textAlign = align; ctx.textBaseline = 'alphabetic'; ctx.letterSpacing = spacing + 'px';
  ctx.lineWidth = 3; ctx.strokeStyle = C.ai; ctx.lineJoin = 'round'; ctx.strokeText(s, x, y);
  ctx.fillStyle = color; ctx.fillText(s, x, y); ctx.letterSpacing = '0px';
}

function drawRing(band) {
  const { x: cx, y: cy, R } = lay.circle, RO = R + 14;
  ctx.strokeStyle = C.ink;
  ctx.lineWidth = 0.6; ctx.beginPath(); ctx.arc(cx, cy, R, 0, 6.2832); ctx.stroke();
  ctx.lineWidth = 1.2; ctx.beginPath(); ctx.arc(cx, cy, RO, 0, 6.2832); ctx.stroke();
  // 輪の目盛り：1° 経緯線が円と交わる所に刻み、5° は長くしてラベル
  const labels = [];
  const tick = (lines, isLon) => {
    for (const v of lines) {
      const five = v % 5 === 0;
      for (const [x, y] of circleCrossings(isLon ? meridian(v) : parallel(v))) {
        const a = Math.atan2(y - cy, x - cx), ux = Math.cos(a), uy = Math.sin(a);
        ctx.lineWidth = five ? 0.8 : 0.5; ctx.beginPath();
        ctx.moveTo(cx + ux * R, cy + uy * R); ctx.lineTo(cx + ux * (R + (five ? 9 : 4)), cy + uy * (R + (five ? 9 : 4))); ctx.stroke();
        if (five && (lay.wide || W >= 500 || v % 10 === 0)) labels.push(   // スマホは 10° ごとに間引く
          { a, s: isLon ? `${v}°E` : `${v}°N` });
      }
    }
  };
  tick(d3.range(110, 171), true); tick(d3.range(5, 66), false);
  ctx.font = `11px ${FELL}`; ctx.fillStyle = C.ink; ctx.textBaseline = 'middle';
  const placed = [];
  for (const l of labels) {
    // 方位の字の近く（上下左右 ±7°）と、近すぎるラベルは出さない
    const card = [0, 0.5, 1, -0.5].some(c => Math.abs(((l.a / Math.PI - c + 3) % 2) - 1) < 0.08);

const fmtSigned = v => (v < 0 ? '−' : '+') + Math.abs(v).toFixed(2);

// 緯度 φ の線が陸にかかる経度区間（海岸線との交点を数えて求める）
const spanCache = new Map();
function landSpans(phi) {
  const key = phi.toFixed(2); if (spanCache.has(key)) return spanCache.get(key);
  const lo0 = SEC_LON0 - SEC_KM / 2 / kmPerDeg(phi) - 1, lo1 = SEC_LON0 + SEC_KM / 2 / kmPerDeg(phi) + 1;
  const xs = [];
  for (const seg of coastSegs) {
    if ((seg[1] - phi) * (seg[3] - phi) >= 0) continue;
    const x = seg[0] + (phi - seg[1]) / (seg[3] - seg[1]) * (seg[2] - seg[0]);
    if (x > lo0 && x < lo1) xs.push(x);
  }
  xs.sort((a, b) => a - b);
  let inside = d3.geoContains(land, [lo0, phi]); const out = []; let start = inside ? lo0 : null;
  for (const x of xs) { if (inside) out.push([start, x]); else start = x; inside = !inside; }

// 円と断面を結ぶ引き出し線（円の右側で帯の中央緯度の点 → 版の左辺の中央）。「西」の字の所は 6px 空ける
